[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-delivery-tracker"
version = "0.0.0.dev0"
description = "Home-Assistant-Integration, die Paket-Benachrichtigungen aus einem IMAP-Postfach auswertet"
readme = "README.md"
# HA 2026.7 setzt Python 3.14.2 voraus.
requires-python = ">=3.14.2"
license = { text = "MIT" }
authors = [{ name = "dominoxp" }]

dependencies = [
    "aioimaplib>=2.0.1",
]

[project.optional-dependencies]
dev = [
    # An die HA-Version gepinnt, die pytest-homeassistant-custom-component mitbringt (2026.7.4).
    "pytest-homeassistant-custom-component==0.13.348",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/delivery_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Repo-Root auf den Suchpfad, damit `custom_components.delivery_tracker` importierbar ist.
pythonpath = ["."]
# setup-docs enthaelt die eingecheckte Referenz-Integration; die wird nie gesammelt.
norecursedirs = ["setup-docs", "card", ".git", ".venv"]

[tool.ruff]
line-length = 100
src = ["."]
# Referenz-Integration und Card-Toolchain sind fremder bzw. kein Python-Code.
extend-exclude = ["setup-docs", "card"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import-Sortierung
    "UP",   # pyupgrade
    "B",    # bugbear
    "ANN",  # fehlende Typannotationen
    "ASYNC",
    "C4",   # comprehensions
    "PTH",  # pathlib statt os.path
    "RET",
    "RUF",
    "SIM",
    "TRY",  # Exception-Handling
]
ignore = [
    "ANN401",  # Any ist bei Mail-Payloads und Attribut-Dicts Absicht
    "TRY003",  # ausformulierte Exception-Messages sind hier erwuenscht
    "TRY400",  # log.error mit explizitem Kontext ist teils gewollt
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.ruff.lint.per-file-ignores]
# ANN201/ANN202: Testfunktionen brauchen kein -> None.
"tests/*" = ["ANN201", "ANN202"]

[tool.pyright]
# Pylance/VS Code: gleiche Quelle wie die Kommandozeile verwenden.
venvPath = "."
venv = ".venv"
include = ["custom_components", "tests"]
exclude = ["setup-docs", "card"]
typeCheckingMode = "standard"
