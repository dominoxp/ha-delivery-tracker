name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: uv installieren
        uses: astral-sh/setup-uv@v5

      - name: Abhaengigkeiten installieren
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q

  card:
    name: Karte (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: card/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
